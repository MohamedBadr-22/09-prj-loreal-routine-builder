<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="routine-endpoint" content="https://loreal-beauty-advisor.mo10saidmm.workers.dev/project9">
<title>L’Oréal Routine Builder</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<header><div><p class="brand">L’ORÉAL</p><h1>Routine Builder</h1><p>Choose your products and build a routine around them.</p></div><label><input id="rtl" type="checkbox"> Right-to-left layout</label></header>
<main>
<section aria-labelledby="catalogTitle">
<h2 id="catalogTitle">Explore products</h2>
<div class="filters"><label for="productSearch">Search products<input id="productSearch" type="search" placeholder="Try CeraVe or vitamin C" dir="auto"></label>
<label for="categoryFilter">Category<select id="categoryFilter"><option value="">All categories</option></select></label></div>
<p id="catalogStatus" role="status">Loading products…</p>
<div id="productsContainer"></div>
</section>
<aside>
<section class="panel" aria-labelledby="selectionTitle">
<h2 id="selectionTitle">Selected products</h2>
<p id="selectionStatus" role="status"></p>
<ul id="selectedProducts"></ul>
<div class="actions"><button type="button" id="generateRoutine" disabled>Generate Routine</button><button type="button" id="clearSelection" disabled>Clear all</button></div>
</section>
<section class="panel" aria-labelledby="chatTitle">
<h2 id="chatTitle">Routine advisor</h2>
<div id="chatWindow" role="log" aria-label="Conversation" tabindex="0"><p>Generate a routine to begin, then ask a follow-up.</p></div>
<form id="chatForm"><label for="chatInput">Follow-up question</label><input id="chatInput" maxlength="1500" dir="auto" required disabled>
<label class="check"><input id="webSearch" type="checkbox"> Search the web for current information</label>
<button id="send" disabled>Send</button></form>
<p id="chatStatus" role="status"></p>
</section>
</aside>
</main>
</body>
</html>
